[package]
name = "awstgbot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = "1.1.6"
aws-types = "1.1.6"
aws-sdk-lightsail = "1.16.0"
aws-sdk-cloudwatch = "1.16.0"
aws-smithy-types = "1.1.7"
tokio = { version = "1.36.0", features = ["full"] }
chrono = { version = "0.4.34", default-features = true }
teloxide = { version = "0.15.0",default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio-util = "0.7.10"
futures = "0.3.30"
lambda_runtime = "0.14.2"
serde_json = "1.0.140"
serde = "1.0.219"
aws_lambda_events = "0.16.1"
bas64 = "0.1.0"
url = "2.5.4"
aws-smithy-runtime-api = "1.8.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary*
